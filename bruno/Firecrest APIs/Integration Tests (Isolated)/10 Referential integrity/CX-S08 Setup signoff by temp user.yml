info:
  name: "CX-S08 Setup: signoff by temp user"
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseURL}}/admin/handoff-signoffs"
  body:
    type: json
    data: |-
      {
        "handoff_id": {{hoId}},
        "signer_id": {{cxUserId}},
        "handoff_message": "BRUNO-IT signoff",
        "signoff_date": "2026-10-21T10:00:00Z",
        "success": true
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["cxUserId", "hoId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.be.oneOf([201]);
        });

        const created = res.getBody();
        if ([200, 201].includes(res.getStatus()) && created && created.id !== undefined) {
          bru.setVar("cxSoId", created.id);
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CX-S08** [Expected] Setup: signoff by temp user

  - Controller: HandoffSignoff
  - Expected status: 201
  - Case type: setup
  - Basis: controller code

