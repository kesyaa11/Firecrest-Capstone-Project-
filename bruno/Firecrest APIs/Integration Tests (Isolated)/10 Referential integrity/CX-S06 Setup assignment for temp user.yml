info:
  name: "CX-S06 Setup: assignment for temp user"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseURL}}/admin/specificationusers"
  body:
    type: json
    data: |-
      {
        "project_id": 1,
        "specification_id": 1,
        "user_id": {{cxUserId}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["cxUserId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.be.oneOf([201]);
        });

        const created = res.getBody();
        if ([200, 201].includes(res.getStatus()) && created && created.id !== undefined) {
          bru.setVar("cxSuId", created.id);
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CX-S06** [Expected] Setup: assignment for temp user

  - Controller: SpecificationUsers
  - Expected status: 201
  - Case type: setup
  - Basis: controller code

