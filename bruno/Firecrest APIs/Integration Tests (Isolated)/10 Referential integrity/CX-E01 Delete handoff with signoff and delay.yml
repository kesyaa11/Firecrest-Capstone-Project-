info:
  name: "CX-E01 Delete handoff with signoff and delay"
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseURL}}/admin/specificationhandoffs/{{cxHoId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["cxHoId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("message is \"Handoff Deleted\"", function () {
          expect(res.getBody().message).to.equal("Handoff Deleted");
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

