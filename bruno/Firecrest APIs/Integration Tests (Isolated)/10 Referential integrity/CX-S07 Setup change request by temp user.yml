info:
  name: "CX-S07 Setup: change request by temp user"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseURL}}/admin/specification-change-requests"
  body:
    type: json
    data: |-
      {
        "specification_id": 1,
        "requester_id": {{cxUserId}},
        "stage": "Test",
        "reason": "BRUNO-IT the specification cannot be implemented as written",
        "created_at": "2026-10-06T00:00:00Z",
        "resolved": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["cxUserId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.be.oneOf([201]);
        });

        const created = res.getBody();
        if ([200, 201].includes(res.getStatus()) && created && created.id !== undefined) {
          bru.setVar("cxCrId", created.id);
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CX-S07** [Expected] Setup: change request by temp user

  - Controller: SpecificationChangeRequests
  - Expected status: 201
  - Case type: setup
  - Basis: controller code

