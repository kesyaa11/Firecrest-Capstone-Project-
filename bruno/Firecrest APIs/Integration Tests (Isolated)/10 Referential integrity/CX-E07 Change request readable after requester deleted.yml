info:
  name: "CX-E07 Change request readable after requester deleted"
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseURL}}/admin/specification-change-requests/{{cxCrId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["cxCrId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("requester_id is None", function () {
          expect(res.getBody().requester_id).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CX-E07** [Expected] Change request readable after requester deleted

  - Controller: SpecificationChangeRequests
  - Expected status: 200
  - Case type: probe
  - Basis: requester_id ON DELETE SET NULL keeps the row; the API must still return it

