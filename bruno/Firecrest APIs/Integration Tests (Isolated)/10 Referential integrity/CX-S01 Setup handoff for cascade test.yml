info:
  name: "CX-S01 Setup: handoff for cascade test"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/admin/specificationhandoffs"
  body:
    type: json
    data: |-
      {
        "project_id": 3,
        "specification_id": 4,
        "notified": "2026-10-20T09:00:00Z",
        "expected": "2026-10-27T17:00:00Z",
        "status": "BRUNO-IT Cascade",
        "description": "BRUNO-IT handoff",
        "success": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.be.oneOf([201]);
        });

        const created = res.getBody();
        if ([200, 201].includes(res.getStatus()) && created && created.id !== undefined) {
          bru.setVar("cxHoId", created.id);
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CX-S01** [Expected] Setup: handoff for cascade test

  - Controller: SpecificationHandoffs
  - Expected status: 201
  - Case type: setup
  - Basis: controller code

