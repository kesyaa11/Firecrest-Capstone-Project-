info:
  name: "CX-S03 Setup: delay on that handoff"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/admin/handoffdelays"
  body:
    type: json
    data: |-
      {
        "handoff_id": {{cxHoId}},
        "reason": "BRUNO-IT cascade delay",
        "delay_hours": 12
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["cxHoId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.be.oneOf([201]);
        });

        const created = res.getBody();
        if ([200, 201].includes(res.getStatus()) && created && created.id !== undefined) {
          bru.setVar("cxHoDId", created.id);
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CX-S03** [Expected] Setup: delay on that handoff

  - Controller: HandoffDelays
  - Expected status: 201
  - Case type: setup
  - Basis: controller code

