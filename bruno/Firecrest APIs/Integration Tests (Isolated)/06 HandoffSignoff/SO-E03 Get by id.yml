info:
  name: "SO-E03 Get by id"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/admin/handoff-signoffs/{{soId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["soId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("id matches {{soId}}", function () {
          expect(res.getBody().id).to.equal(bru.getVar("soId"));
        });

        test("success is True", function () {
          expect(res.getBody().success).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

