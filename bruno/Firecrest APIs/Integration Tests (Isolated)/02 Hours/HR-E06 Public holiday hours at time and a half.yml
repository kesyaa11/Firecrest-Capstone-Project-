info:
  name: "HR-E06 Public holiday hours at time and a half"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/admin/hours/fortnight?userId=2&periodStart=2026-12-22"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("raw_hours is 4", function () {
          expect(res.getBody().raw_hours).to.equal(4);
        });

        test("public_holiday_hours is 4", function () {
          expect(res.getBody().public_holiday_hours).to.equal(4);
        });

        test("holiday_adjusted_hours is 6", function () {
          expect(res.getBody().holiday_adjusted_hours).to.equal(6);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **HR-E06** [Expected] Public holiday hours at time and a half

  - Controller: Hours
  - Expected status: 200
  - Case type: contract
  - Basis: 2026-12-25 is a national NZ holiday (synced from Nager at API start); 4h x 1.5 = 6h

