info:
  name: "HR-E03 Approved sick leave counted"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/admin/hours/fortnight?userId=3&periodStart=2026-08-18"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("approved_leave_calendar_days is 1", function () {
          expect(res.getBody().approved_leave_calendar_days).to.equal(1);
        });

        test("leave_hours is 8", function () {
          expect(res.getBody().leave_hours).to.equal(8);
        });

        test("raw_hours is 0", function () {
          expect(res.getBody().raw_hours).to.equal(0);
        });

        test("leave type is Sick Leave", function () {
          expect(res.getBody().approved_leave.map((l) => l.leave_type)).to.eql(["Sick Leave"]);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **HR-E03** [Expected] Approved sick leave counted

  - Controller: Hours
  - Expected status: 200
  - Case type: contract
  - Basis: Leave request 2 (user 3, Approved, 2026-08-25) at 8h per day

