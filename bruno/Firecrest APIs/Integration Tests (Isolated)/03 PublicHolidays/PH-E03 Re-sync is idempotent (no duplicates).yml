info:
  name: "PH-E03 Re-sync is idempotent (no duplicates)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/admin/publicholidays/country/NZ"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("every row is NZ", function () {
          expect(res.getBody().every((h) => h.country === "NZ")).to.equal(true);
        });

        test("count unchanged after re-sync", function () {
          expect(res.getBody().length).to.equal(bru.getVar("nzCount"));
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **PH-E03** [Expected] Re-sync is idempotent (no duplicates)

  - Controller: PublicHolidays
  - Expected status: 200
  - Case type: contract
  - Basis: Sync updates existing (date, country, name) rows; UNIQUE(name, country, date)

