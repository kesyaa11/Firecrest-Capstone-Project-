runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("Christmas Day on that date", function () {
          const b = res.getBody();
          expect(b.map((h) => h.name)).to.include("Christmas Day");
          expect(b.every((h) => h.date === "2026-12-25")).to.equal(true);
        });

