info:
  name: "HD-U02 Duplicate (handoff, reason)"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseURL}}/admin/handoffdelays"
  body:
    type: json
    data: |-
      {
        "handoff_id": {{hoId}},
        "reason": "BRUNO-IT supplier delay",
        "delay_hours": 12
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["hoId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 409", function () {
          expect(res.getStatus()).to.be.oneOf([409]);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **HD-U02** [Unexpected] Duplicate (handoff, reason)

  - Controller: HandoffDelays
  - Expected status: 409
  - Case type: probe
  - Basis: UNIQUE(handoff_id, reason)

