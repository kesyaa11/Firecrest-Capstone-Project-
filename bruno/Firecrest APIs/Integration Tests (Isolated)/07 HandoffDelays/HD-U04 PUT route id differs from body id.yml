    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["dId", "hoId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 404", function () {
          expect(res.getStatus()).to.be.oneOf([404]);
        });

        test("message is \"Handoff Delay not found\"", function () {
          expect(res.getBody().message).to.equal("Handoff Delay not found");
        });

settings:
