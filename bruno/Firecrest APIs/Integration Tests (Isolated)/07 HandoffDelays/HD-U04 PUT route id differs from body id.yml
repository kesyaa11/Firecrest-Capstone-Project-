info:
  name: "HD-U04 PUT route id differs from body id"
  type: http
  seq: 12

http:
  method: PUT
  url: "{{baseURL}}/admin/handoffdelays/999999"
  body:
    type: json
    data: |-
      {
        "handoff_id": {{hoId}},
        "reason": "BRUNO-IT supplier delay",
        "delay_hours": 12,
        "id": {{dId}}
      }
  auth: inherit

runtime:
