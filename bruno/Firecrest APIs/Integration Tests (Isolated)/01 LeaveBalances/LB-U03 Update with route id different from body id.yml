info:
  name: "LB-U03 Update with route id different from body id"
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseURL}}/admin/leave-balances/999999"
  body:
    type: json
    data: |-
      {
        "user_id": 2,
        "sick_days": 10,
        "al_accured": 160,
        "al_taken_accured": 8,
        "al_outstanding": 152,
        "annual_owing": 0,
        "alternative_days": 1,
        "id": {{lbId}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["lbId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 400", function () {
          expect(res.getStatus()).to.be.oneOf([400]);
        });

        test("message is \"The route ID must match the leave balance ID\"", function () {
          expect(res.getBody().message).to.equal("The route ID must match the leave balance ID");
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

