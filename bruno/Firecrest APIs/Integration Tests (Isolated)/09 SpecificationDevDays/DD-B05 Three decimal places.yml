http:
  method: POST
  url: "{{baseURL}}/admin/specificationdevdays"
  body:
    type: json
    data: |-
      {
        "project_id": 1,
        "specification_id": 1,
        "specified_month": "2027-03-01",
        "dev_days": 0.001
      }
