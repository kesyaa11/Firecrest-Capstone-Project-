info:
  name: "CR-E01 Create change request"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/admin/specification-change-requests"
  body:
    type: json
    data: |-
      {
        "specification_id": 2,
        "requester_id": 2,
        "stage": "Specs",
        "reason": "BRUNO-IT the specification cannot be implemented as written",
        "created_at": "2026-10-06T00:00:00Z",
        "resolved": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.be.oneOf([201]);
        });

        test("stage is Specs", function () {
          expect(res.getBody().stage).to.equal("Specs");
        });

        test("resolved is False", function () {
          expect(res.getBody().resolved).to.equal(false);
        });

        test("Location header points at the new record", function () {
          expect(String(res.getHeader("location") || "").toLowerCase()).to.contain("/admin/specification-change-requests/");
        });

        const created = res.getBody();
        if ([200, 201].includes(res.getStatus()) && created && created.id !== undefined) {
          bru.setVar("crId", created.id);
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CR-E01** [Expected] Create change request

  - Controller: SpecificationChangeRequests
  - Expected status: 201
  - Case type: contract
  - Basis: controller code

