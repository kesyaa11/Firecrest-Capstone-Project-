info:
  name: "CR-E03 Get by id"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/admin/specification-change-requests/{{crId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skip (reported as BLOCKED) when a record this case depends on was not created
        const needed = ["crId"];
        const missing = needed.filter((name) => bru.getVar(name) === undefined || bru.getVar(name) === null || bru.getVar(name) === "");
        if (missing.length) {
          console.log("BLOCKED: missing " + missing.join(", "));
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.be.oneOf([200]);
        });

        test("id matches {{crId}}", function () {
          expect(res.getBody().id).to.equal(bru.getVar("crId"));
        });

        test("specification_id is 2", function () {
          expect(res.getBody().specification_id).to.equal(2);
        });

        test("requester_id is 2", function () {
          expect(res.getBody().requester_id).to.equal(2);
        });

        test("resolved is False", function () {
          expect(res.getBody().resolved).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  **CR-E03** [Expected] Get by id

  - Controller: SpecificationChangeRequests
  - Expected status: 200
  - Case type: contract
  - Basis: controller code

