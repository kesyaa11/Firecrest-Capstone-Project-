    data: |-
      {
        "specification_id": 2,
        "requester_id": 3,
        "stage": "Test",
        "reason": "BRUNO-IT the specification cannot be implemented as written",
        "created_at": "2026-10-06T09:30:00",
        "resolved": false
      }
