services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: FirecrestDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: DotNet10
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Port=5432;Database=FirecrestDB;Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      - db

volumes:
  postgres_data: