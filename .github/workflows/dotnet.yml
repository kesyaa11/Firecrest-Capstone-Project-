name: Firecrest .NET CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Firecrest.slnx

    - name: Build
      run: dotnet build Firecrest.slnx --no-restore

    - name: Test
      run: dotnet test Firecrest.slnx --no-build
